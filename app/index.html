<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WGA Raid Hub</title>
    <!-- The Go Again ring logo, from the logo files (2026-09-20). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The link preview Discord and other chat apps show for a pasted address
         (#1226). The picture is the front page's banner, from npm run help:shots;
         og:image must be a full address, so the site's comes from VITE_SITE_URL. -->
    <meta name="description" content="Your raid team's loot, roster and raid nights, in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WGA Raid Hub" />
    <meta property="og:title" content="WGA Raid Hub" />
    <meta property="og:description" content="Your raid team's loot, roster and raid nights, in one place." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f2703f" />
    <script>
      // Set the theme before first paint so a light-mode visitor never sees a dark flash.
      // Same rule as src/theme/theme.ts: a saved choice wins, otherwise the system setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('wga-theme');
        } catch (e) {}
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
