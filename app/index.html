<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WGA Raid Hub</title>
    <script>
      // Set the theme before first paint so a light-mode visitor never sees a dark flash.
      // Same rule as src/theme/theme.ts: a saved choice wins, otherwise the system setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('wga-theme');
        } catch (e) {}
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
