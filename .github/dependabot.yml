version: 2
# A non-empty `labels` list is the documented way to override the labels
# Dependabot applies by default, which is why every ecosystem carries one.
# It reads `chore` since #1019: the label these PRs used to carry,
# skip-changelog, was the changelog gate's exemption switch and no longer
# exists. Bot bumps are still exempt from the bump and the entry, but by PR
# author inside changelog.yml, where a label cannot be applied by habit to
# something a person wrote.
updates:
  # Workflow action refs only. Steps that pin a tool version through an
  # input (supabase/setup-cli's `version: 2.109.0`) are not touched by
  # dependabot, so that pin stays where the workflow comments say to bump it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - chore
    groups:
      dev-dependencies:
        patterns:
          - '*'
    ignore:
      # eslint 9 requires migrating .eslintrc.json to flat config; take that
      # on deliberately, not as a weekly update.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  # The Discord bot (#954) keeps its own package.json and lockfile, so it
  # needs its own entry. Runtime dependencies are left ungrouped on purpose:
  # a discord.js or supabase-js bump changes what the bot does at runtime and
  # should arrive on its own to be read, unlike the dev-tool bumps above.
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
    labels:
      - chore
    groups:
      bot-dev-dependencies:
        dependency-type: development
        patterns:
          - '*'

  # The new app (#1109) keeps its own package.json and lockfile under app/,
  # so it needs its own entry (#1180). Same shape as bot/'s: dev tools grouped
  # into one PR, runtime dependencies (react, react-router, TanStack Query,
  # supabase-js) left ungrouped so each bump arrives alone to be read.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    labels:
      - chore
    groups:
      app-dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
    ignore:
      # typescript-eslint has no TypeScript 7 support yet, which is why #1147
      # scaffolded the app on 6; take that major on deliberately.
      # tests/ci/dependabot-config.test.js reads the peer range that holds
      # each ignore below and goes red when it no longer does (#1241).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-jsx-a11y declares a peer of eslint up to ^9, so a bundled
      # eslint major fails npm ci (#1233). The root carries this ignore for
      # its .eslintrc.json; app/ is flat config already and carries it for
      # the plugin. @eslint/js moves in lockstep and its 10 peers on eslint
      # 10, so it is held with it. Both lift when an eslint-plugin-jsx-a11y
      # release takes eslint 10 (#1238), which the same test says out loud.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
