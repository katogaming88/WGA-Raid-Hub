name: RLS tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      # tests/rls/** rather than tests/**: this job boots a full Postgres
      # stack, and the RLS tests import nothing outside their own directory,
      # so a browser or frontend test had no business starting one.
      - 'tests/rls/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rls-tests.yml'

# A new push to the PR supersedes any still-running check on the old commit,
# so stale runs stop booting a full Postgres stack for a superseded diff.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pin as schema-docs.yml; bump both together (see the comment
      # there for why the CLI version is tied to the tbls docs).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      # db reset applies roles.sql, every migration, and supabase/seed.sql,
      # so a broken seed fails here before the tests run.
      - name: Build database (roles, migrations, seed)
        run: |
          supabase db start
          supabase db reset
      # Log only, no assertion: the T3 set-equality test in
      # tests/rls/function-invariants.test.js is the gate. This prints what
      # environment CI actually built (#1010). The local stack and CI can pull
      # different Postgres image builds, and the image's own init script is
      # what grants EXECUTE on new public functions to the three API roles
      # until roles.sql revokes it, so the image tag belongs beside the row.
      - name: Measure function grant defaults
        run: |
          docker ps --filter name=supabase_db --format '{{.Image}}'
          docker exec supabase_db_WGA-Raid-Hub psql -U postgres -At \
            -c "select coalesce(array_to_string(defaclacl, ','), '(none)') from pg_default_acl where defaclnamespace = 'public'::regnamespace and defaclobjtype = 'f' and defaclrole = 'postgres'::regrole;" \
            -c "select count(*) filter (where has_function_privilege('anon', oid, 'execute')) as anon, count(*) filter (where has_function_privilege('authenticated', oid, 'execute')) as authenticated, count(*) filter (where has_function_privilege('service_role', oid, 'execute')) as service_role from pg_proc where pronamespace = 'public'::regnamespace;"
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run RLS policy tests
        run: npm run test:rls
