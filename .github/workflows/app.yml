name: App

# The new app in app/ (#1101): typecheck, lint, format, unit tests and a
# production build on every PR that touches it. The current site's checks
# never look inside app/, and this job never looks outside it.
on:
  pull_request:
    paths:
      - 'app/**'
      # The app's Supabase types come from the current site's copy until the
      # cutover (app/src/lib/supabase.ts).
      - 'js/database.types.ts'
      - '.github/workflows/app.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
