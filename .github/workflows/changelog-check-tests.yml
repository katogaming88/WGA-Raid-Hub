name: Changelog check tests

# The changelog-check classifier is plain node with no database, so it gets
# the same cheap job shape as the import tests.
on:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/changelog-check-tests.yml'
      # tests/ci/dependabot-config.test.js reads this file (#1180); listing
      # it here is what makes that guard run on the PR that edits it. #1128
      # asks the same of deploy.yml and config.toml.
      - '.github/dependabot.yml'
      # The same test reads the app lockfile for the peer ranges that hold the
      # /app majors (#1241), and a Dependabot /app bump changes only these two.
      - 'app/package.json'
      - 'app/package-lock.json'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run changelog-check tests
        run: npm run test:ci
