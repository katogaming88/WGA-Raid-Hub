name: Changelog Check

on:
  pull_request:
    # labeled/unlabeled so toggling the skip-changelog label re-evaluates the
    # exemption without needing a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The exemption below is the `skip-changelog` label only, not the `chore`
# kind label or a chore/* branch name. Both of those are decided by the
# branch a PR is on (labeler.yml, #953) before anyone has seen the diff, so
# keying the changelog gate on either one let a branch named before any code
# was written silently cover a diff that turned out to touch a shipped piece.
# skip-changelog auto-applies only when the diff itself touches none of the
# four shipped-piece paths (labeler.yml), and can otherwise be added by hand
# for a genuinely mechanical change to a shipped path (formatting, comments) --
# either way it reflects what the diff is, not what the branch is called.

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Elevated beyond the hard-gate steps' needs so the needs-news-entry nudge
    # below can label/comment on the PR (#525).
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Classifies the diff (#353, extended by #966). Four shipped classes:
      # frontend = js/, css/ and root-page paths, with js/common.js counting
      # only when its diff goes beyond the VERSION line, so complying with
      # "bump VERSION" cannot itself mark a PR functional. backend = the db
      # class, supabase/migrations/ and scripts/import/. functions =
      # supabase/functions/. bot = bot/. Everything else (supabase/config.toml,
      # seed.sql, roles.sql, docs, tests, scripts/ci) is chore territory.
      #
      # shipped = any of the four changed, which is exactly when the product
      # version has to move (#965). missing_entry lists the classes that
      # changed without gaining their CHANGELOG section. heading_error is set
      # when the PR adds a version heading that repeats one on the base branch
      # or sorts at or below the newest one there.
      #
      # The script has no dependencies, so no npm ci here.
      - name: Classify the diff
        id: changed
        run: node scripts/ci/changelog-check.js origin/${{ github.base_ref }}

      # The three hard gates below share the skip-changelog exemption: the
      # VERSION bump and the sectioned changelog both signal "something
      # shipped", which a mechanical PR does not do. #353 extends the
      # exemption to the changelog-entry checks, superseding the no-bypass
      # rule from be59777.
      - name: Fail if a shipped change lacks its changelog section
        if: >-
          steps.changed.outputs.missing_entry != '' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          echo "::error::CHANGELOG.md gained no entry for: ${{ steps.changed.outputs.missing_entry }}. Each shipped piece logs under its own heading (frontend -> '### Frontend', db -> '### Backend', functions -> '### Functions', bot -> '### Bot'). See CONTRIBUTING.md; if this PR is mechanical, add the skip-changelog label."
          exit 1

      # #965 retired the old rule that only frontend paths drove VERSION. One
      # version line covers the whole project, so a migration, an Edge Function
      # or a bot change moves it too.
      - name: Fail if a shipped change lacks a VERSION bump
        if: >-
          steps.changed.outputs.shipped == 'true' &&
          steps.changed.outputs.version_bump == 'false' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          echo "::error::The VERSION in js/common.js was not bumped, but a shipped piece changed. Every PR that changes the frontend, supabase/migrations/, scripts/import/, supabase/functions/ or bot/ stamps the product: run 'npm run stamp -- <x.y.z>' (see CONTRIBUTING.md). If this change is mechanical, add the skip-changelog label."
          exit 1

      # The reverse direction (#353): a bump with nothing shipped trains
      # reflexive bumping and erodes VERSION as the "something shipped" signal.
      - name: Fail if VERSION bumps with nothing shipped
        if: >-
          steps.changed.outputs.shipped == 'false' &&
          steps.changed.outputs.version_bump == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          echo "::error::The VERSION in js/common.js was bumped, but no shipped piece changed. Docs, CI config, supabase/config.toml, seed.sql and roles.sql take no bump and no changelog section (see CONTRIBUTING.md); add the skip-changelog label."
          exit 1

      # Not skip-changelog-exempt: this fires only when a version heading was actually
      # added, and a heading that repeats or goes backwards is wrong whoever
      # wrote it. Three numbers on main are already used twice (3.77.23,
      # 3.60.32, 3.60.6) because nothing checked this; they stay as they are,
      # annotated in place, because a released number is never reissued (#965).
      # The check reads only what the PR adds, so that history is legal.
      - name: Fail if the new version heading repeats or goes backwards
        if: steps.changed.outputs.heading_error != ''
        run: |
          echo "::error::CHANGELOG.md heading problem: ${{ steps.changed.outputs.heading_error }}. Pick the next free number above the newest heading; never reissue a released one and never edit a released block."
          exit 1

      # Re-derives version.json's pieces map from the paths this PR changed,
      # against its real merge base, and fails when the committed manifest
      # disagrees. The stamper computes that map on the author's machine from
      # their own origin/main; a stale base widens the diff and marks a piece
      # the release never touched, which nothing could see before.
      #
      # Not chore-exempt, and it needs no exemption: a PR whose version.json
      # is unchanged passes without any further question, which is every chore
      # and docs PR by definition.
      - name: Check the version manifest against the changed paths
        run: node scripts/ci/manifest-check.js origin/${{ github.base_ref }}

      # Non-blocking nudge (#525, follow-up to the #509 News tab): a PR that
      # gained a Frontend changelog entry but never touched news.json might
      # just have forgotten a news-worthy entry -- not every Frontend change
      # is news-worthy, so this labels/comments rather than failing the job.
      # Always runs (no needsNudge gate on the step itself) so the label gets
      # removed again once news.json is added or the skip-changelog exemption
      # applies on a later push, not just added and left stale.
      - name: Nudge for a missing news.json entry
        uses: actions/github-script@v9
        env:
          NEEDS_NUDGE: >-
            ${{
              steps.changed.outputs.frontend_entry == 'true' &&
              steps.changed.outputs.news_touched == 'false' &&
              !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
            }}
        with:
          script: |
            const label = 'needs-news-entry';
            const needsNudge = process.env.NEEDS_NUDGE === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const hasLabel = labels.some((l) => l.name === label);

            if (needsNudge && !hasLabel) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body:
                  "This PR added a `### Frontend` CHANGELOG entry but didn't touch `news.json`. " +
                  'If this change is raider-facing and news-worthy, consider adding an entry (see `news.json` for the format). ' +
                  "Not every Frontend change needs one -- this is just a reminder, not a blocker."
              });
            } else if (!needsNudge && hasLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
            }
