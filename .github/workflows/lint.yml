name: Lint

on:
  pull_request:
    paths:
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - '.eslintrc.json'
      - '.prettierrc.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      # Checks only the js/ files that opt in with // @ts-check (see
      # tsconfig.json); plain .js ships as-is, there is no build step.
      - name: Type check
        run: npm run typecheck
      # Fails a fixture in the RLS suite that commits where the other workers
      # can read it (#1021). Lives here rather than in rls-tests.yml because it
      # reads the files as text and needs no database, and this job already
      # triggers on tests/** with node installed.
      - name: Check RLS fixtures roll back
        run: node scripts/ci/rls-no-autocommit-check.js
