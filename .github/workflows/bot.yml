name: Bot

on:
  pull_request:
    paths:
      - 'bot/**'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      # Same Node major as the bot's actual runtime (the Oracle VM's pm2
      # processes run Node 20, see DEPLOYMENT.md), so a type error CI misses
      # doesn't surprise the deployed process either.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      # No lint/test script exists yet (#954: the bot repo had no CI at all)
      # -- a clean `tsc` build is the first real gate, catching what would
      # otherwise only surface after a VM deploy.
      - name: Build
        run: npm run build
