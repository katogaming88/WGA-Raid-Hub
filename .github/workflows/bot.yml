name: Bot

on:
  pull_request:
    paths:
      - 'bot/**'
      # Without its own path here, a change to this file alone never runs it.
      - '.github/workflows/bot.yml'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      # Same Node major as the bot's actual runtime (the Oracle VM's pm2
      # processes run Node 20, see DEPLOYMENT.md), so a type error CI misses
      # doesn't surprise the deployed process either. This is also why the
      # bot pins vitest 4: vitest 5 requires Node 22.12 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      # Prettier reads the repo's root config by upward search; the bot has no
      # config of its own, deliberately (#987).
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      # This is the command the VM runs, so it gates the deploy path itself.
      # `tsc` emitting is a superset of the `typecheck` script, which stays in
      # package.json for local use rather than being run twice here.
      - name: Build
        run: npm run build
