name: Accessibility browser tests

# The only job here that runs a real browser (#810). Everything else in CI
# reads the pages as text or loads js/ into a vm sandbox, neither of which can
# see contrast, reflow, or anything a page renders after its async reads land.
#
# Hermetic: the suite serves the site from tests/browser/static-server.js and
# answers every third-party and Supabase request from fixtures, so this job
# never reaches the network past npm and the browser download.
on:
  pull_request:
    paths:
      - 'index.html'
      - 'officer.html'
      - 'admin.html'
      - 'guild.html'
      - 'boe.html'
      - 'css/**'
      - 'js/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/a11y-browser.yml'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  a11y-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Keyed on the resolved playwright version rather than the lockfile hash:
      # the browser build a playwright release pins is what the cache holds, so
      # an unrelated dependency bump should not throw it away.
      - name: Resolve the playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The runner image ships a pre-configured google-chrome-stable apt
      # source that --with-deps' apt-get update below also refreshes, even
      # though nothing here installs that package. Its mirror intermittently
      # publishes a Packages index whose hash doesn't match its own Release
      # file (a race on Google's end, not ours), which fails the whole apt-get
      # update and takes chromium's real dependencies down with it. Matched by
      # content rather than a hardcoded filename -- the exact file
      # (google-chrome.list on most images) isn't a contract this job can rely
      # on staying put, but the repo host it points at is what we're actually
      # trying to drop.
      - name: Remove the unused google-chrome apt source
        run: sudo find /etc/apt/sources.list.d -type f -exec grep -q 'dl\.google\.com/linux/chrome' {} \; -delete

      # --with-deps here but not in CONTRIBUTING.md: it shells out to apt, so
      # it works on this runner and fails on a contributor's Mac or Windows
      # box. It stays even on a cache hit, since the cache holds the browser
      # build and not the system libraries it links against.
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run the accessibility browser tests
        run: npm run test:a11y
