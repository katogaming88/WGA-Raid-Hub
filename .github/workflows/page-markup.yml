name: Page markup check

# Pure node, no database -- the same cheap job shape as the asset version check.
# The markup test is the only thing in CI that reads HTML. Until #437 it ran
# only in the workflow that runs tests/ci, whose path filter had no *.html
# entry, so editing a page never ran it. That workflow (ci-guards.yml) has run
# on every PR since #1128; this one still runs the test under its own name on
# the pages it judges.
on:
  pull_request:
    paths:
      - 'index.html'
      - 'officer.html'
      - 'admin.html'
      - 'guild.html'
      - 'boe.html'
      # The team-free page rules also read the scripts that boot them.
      - 'js/guild.js'
      - 'js/boe-page.js'
      - 'tests/ci/page-markup.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/page-markup.yml'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  page-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run page markup check
        run: npx vitest run tests/ci/page-markup.test.js
